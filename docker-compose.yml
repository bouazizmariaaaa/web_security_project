services:
  web:
    build: .
    container_name: student_webapp_vulnerable
    ports:
      - "8080:80"
    volumes:
      - ./vulnerable_version:/var/www/html
    environment:
      - MYSQL_HOST=db
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: student_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: student_events_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/mysql/data
      - ./vulnerable_version/database/database.sql:/docker-entrypoint-initdb.d/database.sql

volumes:
  db_data:
